[package]
name = "pyra"
version = "0.2.2"
edition = "2024"
license = "GPL-3.0-only"
description = "Local, unattended eye-bar overlays for Windows"

[dependencies]
anyhow = "1.0"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader",
  "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi", "Win32_System_Registry", "Win32_System_Diagnostics_Debug",
  "Win32_System_SystemInformation", "Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_Storage_Xps"
] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
